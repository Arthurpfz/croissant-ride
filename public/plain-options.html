<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plain background options</title>
<style>
body{margin:0;padding:20px;background:#0c0d0e;color:#e9e6df;font:15px/1.4 system-ui,sans-serif}
h1{font-size:18px;margin:0 0 4px}p{margin:0 0 18px;color:#9a9891}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
figure{margin:0}figcaption{padding:8px 2px;font-weight:600}figcaption span{font-weight:400;color:#9a9891}
.bg{position:relative;aspect-ratio:9/14;border-radius:14px;overflow:hidden;background:var(--base)}
.bg::before{content:"";position:absolute;inset:0;background:
 radial-gradient(45% 32% at 30% 36%,var(--a),transparent 70%),
 radial-gradient(40% 28% at 72% 22%,var(--b),transparent 70%),
 radial-gradient(48% 30% at 76% 78%,var(--a),transparent 72%),
 radial-gradient(40% 30% at 12% 88%,var(--c),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.38) 1px,transparent 1.4px) 0 0/12px 12px;
 -webkit-mask:radial-gradient(60% 50% at 45% 45%,#000,transparent 90%);mask:radial-gradient(60% 50% at 45% 45%,#000,transparent 90%)}
.hud{position:absolute;z-index:1;left:10px;right:10px;top:10px;padding:14px 16px;border-radius:14px;background:rgba(20,21,22,.8);border:1px solid rgba(255,255,255,.08);font-family:ui-monospace,monospace;font-size:12px;color:#a9a7a0}
.hud b{display:block;font-size:54px;line-height:1;color:#f1eee7;letter-spacing:2px;margin:6px 0}
.hud i{display:block;height:5px;border-radius:3px;background:linear-gradient(90deg,#e8783a 62%,rgba(255,255,255,.1) 62%);margin-top:10px}
.ok{color:#d5dfa5}
.wo{top:auto;bottom:10px;font-family:system-ui;color:#e9e6df;font-size:13px}
</style>
<h1>Plain background: four colour options</h1>
<p>A still picture instead of the 3D world: no rider, no landscape, nothing moving. Dark base, soft glows, a faint dot grid.</p>

<figure><div class="bg" style="--base:#131415;--a:rgba(120,120,118,.18);--b:rgba(90,90,90,.16);--c:rgba(0,0,0,.5)"><div class="hud">31 km/h · 26.2 km · 49:37<b>181</b><span class="ok">● ON TARGET</span> · Target 182 W · 88 / 90 rpm<i></i></div><div class="hud wo">● 52 min @ 182 W · 90 rpm</div></div><figcaption>4 · Graphite <span>neutral grey, the quietest</span></figcaption></figure>
</div>
